name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 0'  # Weekly Sunday midnight UTC

jobs:
  lint:
    name: ShellCheck & Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Bash syntax check (bash -n)
        run: |
          failed=0
          for f in install.sh lib/*.sh uninstall.sh distros/*/install-*.sh \
                   verify_scripts.sh verify_advanced.sh test_final.sh \
                   assets/honey-badger-*; do
            if bash -n "$f"; then
              echo "✓ $f"
            else
              echo "✗ $f"
              failed=1
            fi
          done
          exit $failed

      - name: Completions syntax check
        run: |
          failed=0
          for f in completions/honey-badger.bash completions/honey-badger.zsh; do
            if [[ -f "$f" ]]; then
              if bash -n "$f" 2>/dev/null; then
                echo "✓ $f"
              else
                echo "✗ $f (syntax error)"
                failed=1
              fi
            fi
          done
          exit $failed

      - name: Theme and metadata validation
        run: |
          test -s theme/honey-badger-theme.css
          grep -q "@define-color" theme/honey-badger-theme.css
          test -s theme/gtkrc-2.0
          test -s theme/honey-badger-theme-hc.css
          grep -q "^Name=Ratel" theme/index.theme
          grep -q "^Name=Ratel-HC" theme/index-hc.theme
          for key in BG SURFACE BASE BORDER TEXT MUTED_TEXT ACCENT ACCENT_TEXT; do
            grep -q "^HONEY_BADGER_THEME_${key}=" config/honey-badger-os.conf || {
              echo "✗ missing palette token: $key"; exit 1;
            }
          done
          echo "✓ Theme files and palette tokens present"

      - name: Theme lint (structure, selectors, contrast)
        run: python3 scripts/lint-theme.py

      - name: Config sourcing validation
        run: |
          # Verify config file can be sourced without side effects
          bash -c 'source config/honey-badger-os.conf && echo "✓ Config sources cleanly"'
          # Verify config validation rejects command substitution
          echo 'EVIL=$(rm -rf /)' > /tmp/bad-config.conf
          if bash -c 'source lib/common.sh && _hb_validate_config /tmp/bad-config.conf' 2>/dev/null; then
            echo "✗ Config validation should reject command substitution"
            exit 1
          else
            echo "✓ Config validation correctly rejects command substitution"
          fi

      - name: ShellCheck
        run: |
          shellcheck -x -s bash \
            -e SC2034 \
            install.sh lib/common.sh uninstall.sh \
            distros/*/install-*.sh \
            assets/honey-badger-*

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run verify_scripts.sh
        run: bash verify_scripts.sh

      - name: Run verify_advanced.sh
        run: bash verify_advanced.sh

      - name: Run test_final.sh
        run: bash test_final.sh

  distro-dry-run:
    name: Dry-run (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: arch
            image: archlinux:latest
          - distro: debian
            image: debian:bookworm
          - distro: fedora
            image: fedora:latest
          - distro: slackware
            image: vbatts/slackware:latest
          - distro: void
            image: ghcr.io/void-linux/void-glibc:latest
          - distro: opensuse
            image: opensuse/tumbleweed:latest
          - distro: gentoo
            image: gentoo/stage3:latest
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install container prerequisites
        run: |
          # actions/checkout needs Node.js which requires libstdc++ and other libs
          if command -v xbps-install >/dev/null 2>&1; then
            xbps-install -Syu xbps -y || true
            xbps-install -Sy bash curl git libstdc++ -y
          elif command -v pacman >/dev/null 2>&1; then
            pacman -Sy --noconfirm git
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update && apt-get install -y git
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y git
          elif command -v zypper >/dev/null 2>&1; then
            zypper --non-interactive install git
          elif command -v slackpkg >/dev/null 2>&1; then
            # Slackware: git may already be present in full images
            command -v git >/dev/null 2>&1 || slackpkg update gpg 2>/dev/null || true
          elif command -v emerge >/dev/null 2>&1; then
            # Use getuto.sh for a fast Portage snapshot instead of slow emerge --sync
            emerge-webrsync --quiet 2>/dev/null || true
            emerge --ask=n dev-vcs/git 2>/dev/null || true
          fi

      - uses: actions/checkout@v4

      - name: Install bash (if needed)
        run: |
          command -v bash >/dev/null 2>&1 || {
            if command -v pacman >/dev/null 2>&1; then pacman -Sy --noconfirm bash
            elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y bash
            elif command -v dnf >/dev/null 2>&1; then dnf install -y bash
            elif command -v xbps-install >/dev/null 2>&1; then xbps-install -Sy bash
            fi
          }

      - name: Syntax check distro script
        run: bash -n distros/${{ matrix.distro }}/install-${{ matrix.distro }}.sh

      - name: Dry-run install
        run: |
          export HONEY_BADGER_DRY_RUN=1
          export HONEY_BADGER_NONINTERACTIVE=1
          export HONEY_BADGER_INSTALL_TYPE=minimal
          bash distros/${{ matrix.distro }}/install-${{ matrix.distro }}.sh || true
