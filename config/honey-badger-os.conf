# ═══════════════════════════════════════════════════════════════════════════════
# Honey Badger OS Configuration
# ═══════════════════════════════════════════════════════════════════════════════
# Sourced by lib/common.sh. Every value can be overridden with an environment
# variable of the same name before running install.sh. Unknown keys are ignored
# with a warning, and command substitution is rejected for safety.
# ═══════════════════════════════════════════════════════════════════════════════

# ── Release identity ─────────────────────────────────────────────────────────
HONEY_BADGER_VERSION="${HONEY_BADGER_VERSION:-2.4.0}"
HONEY_BADGER_CODENAME="${HONEY_BADGER_CODENAME:-Fearless}"
HONEY_BADGER_BUILD_DATE="${HONEY_BADGER_BUILD_DATE:-2026}"

# ── Theme palette ────────────────────────────────────────────────────────────
# A warm, low-fatigue dark palette: espresso surfaces, honey accent, warm ink.
# These values drive the GTK2/GTK3 themes and the generated wallpaper.
HONEY_BADGER_THEME_BG="${HONEY_BADGER_THEME_BG:-#16120d}"          # Window background
HONEY_BADGER_THEME_SURFACE="${HONEY_BADGER_THEME_SURFACE:-#201a14}"     # Panels, headerbars, menus
HONEY_BADGER_THEME_BASE="${HONEY_BADGER_THEME_BASE:-#12100b}"        # Text views, lists, inputs
HONEY_BADGER_THEME_BORDER="${HONEY_BADGER_THEME_BORDER:-#3a3128}"      # Hairlines and frame edges
HONEY_BADGER_THEME_TEXT="${HONEY_BADGER_THEME_TEXT:-#f3ebdf}"        # Primary foreground
HONEY_BADGER_THEME_MUTED_TEXT="${HONEY_BADGER_THEME_MUTED_TEXT:-#b8a992}"  # Secondary foreground
HONEY_BADGER_THEME_ACCENT="${HONEY_BADGER_THEME_ACCENT:-#e6a92e}"      # Honey — selections, focus, links
HONEY_BADGER_THEME_ACCENT_TEXT="${HONEY_BADGER_THEME_ACCENT_TEXT:-#1a1409}" # Foreground on accent surfaces
HONEY_BADGER_THEME_WARNING="${HONEY_BADGER_THEME_WARNING:-#e9b44c}"
HONEY_BADGER_THEME_ERROR="${HONEY_BADGER_THEME_ERROR:-#e0685c}"
HONEY_BADGER_THEME_SUCCESS="${HONEY_BADGER_THEME_SUCCESS:-#79b96f}"
HONEY_BADGER_THEME_INFO="${HONEY_BADGER_THEME_INFO:-#6aa9e0}"

# Theme variant: default or high-contrast (also settable with --high-contrast)
HONEY_BADGER_THEME_VARIANT="${HONEY_BADGER_THEME_VARIANT:-default}"

# ── Desktop typography ───────────────────────────────────────────────────────
HONEY_BADGER_FONT="${HONEY_BADGER_FONT:-Noto Sans 10}"
HONEY_BADGER_MONO_FONT="${HONEY_BADGER_MONO_FONT:-Noto Sans Mono 10}"

# ── Editor ───────────────────────────────────────────────────────────────────
EDITOR="${EDITOR:-nano}"
VISUAL="${VISUAL:-nano}"

# ── Development mode ─────────────────────────────────────────────────────────
# true enables debug logging automatically (helpful when hacking on the installer).
HONEY_BADGER_DEV_MODE="${HONEY_BADGER_DEV_MODE:-false}"

# ── Component skip flags ─────────────────────────────────────────────────────
# Prefer the matching CLI flags (--skip-docker, --skip-theme, …).
# HONEY_BADGER_SKIP_DOCKER=1
# HONEY_BADGER_SKIP_PYTHON=1
# HONEY_BADGER_SKIP_NODE=1
# HONEY_BADGER_SKIP_NANO=1
# HONEY_BADGER_SKIP_THEME=1
# HONEY_BADGER_SKIP_GIT=1

# ── Tunables ─────────────────────────────────────────────────────────────────
# HONEY_BADGER_LOG_COUNT=5
# HONEY_BADGER_NETWORK_TIMEOUT=3
# HONEY_BADGER_MIN_DISK_GB=5
# HONEY_BADGER_WALLPAPER_SIZE="1920x1080"
# HONEY_BADGER_NPM_GLOBAL_PATH="$HOME/.npm-global"

# ── Git identity (non-interactive installs) ──────────────────────────────────
# HONEY_BADGER_GIT_USERNAME=""
# HONEY_BADGER_GIT_EMAIL=""
