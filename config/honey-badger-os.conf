# ═══════════════════════════════════════════════════════════════════════════════
# Ratel Forge Configuration
# (Honey Badger OS identifiers are retained for compatibility)
# ═══════════════════════════════════════════════════════════════════════════════
# Sourced by lib/common.sh. Every value can be overridden with an environment
# variable of the same name before running install.sh. Unknown keys are ignored
# with a warning, and command substitution is rejected for safety.
# ═══════════════════════════════════════════════════════════════════════════════

# ── Release identity ─────────────────────────────────────────────────────────
HONEY_BADGER_VERSION="${HONEY_BADGER_VERSION:-3.0.1}"
HONEY_BADGER_CODENAME="${HONEY_BADGER_CODENAME:-Fearless}"
HONEY_BADGER_BUILD_DATE="${HONEY_BADGER_BUILD_DATE:-2026}"

# ── Editor ───────────────────────────────────────────────────────────────────
EDITOR="${EDITOR:-nano}"
VISUAL="${VISUAL:-nano}"

# ── Development mode ─────────────────────────────────────────────────────────
# true enables debug logging automatically (helpful when hacking on the installer).
HONEY_BADGER_DEV_MODE="${HONEY_BADGER_DEV_MODE:-false}"

# ── Component skip flags ─────────────────────────────────────────────────────
# Prefer the matching CLI flags (--skip-docker, --skip-python, …).
# HONEY_BADGER_SKIP_DOCKER=1
# HONEY_BADGER_SKIP_PYTHON=1
# HONEY_BADGER_SKIP_NODE=1
# HONEY_BADGER_SKIP_NANO=1
# HONEY_BADGER_SKIP_SHELL=1
# HONEY_BADGER_SKIP_GIT=1

# ── Tunables ─────────────────────────────────────────────────────────────────
# HONEY_BADGER_LOG_COUNT=5
# HONEY_BADGER_NETWORK_TIMEOUT=3
# HONEY_BADGER_MIN_DISK_GB=5
# HONEY_BADGER_NPM_GLOBAL_PATH="$HOME/.npm-global"

# ── Git identity (non-interactive installs) ──────────────────────────────────
# HONEY_BADGER_GIT_USERNAME=""
# HONEY_BADGER_GIT_EMAIL=""
